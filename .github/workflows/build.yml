name: Build

# Bridge tests + Android APK -> Docker image (serving that APK from its dashboard) on GHCR.
# Tags v* also publish a GitHub Release with the APK.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["bridge/**", "android/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["bridge/**", "android/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write   # releases
  packages: write   # ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Sign with your own key so the APK installs as an update over the existing app.
      # Without the secrets it's signed with a throwaway debug key (testing only).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ATVB_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK is signed with a throwaway debug key"
          fi
      - run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
        env:
          ATVB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATVB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATVB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mv app/build/outputs/apk/release/app-release.apk ATVBridge.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: android/ATVBridge.apk

  image:
    needs: [bridge-tests, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The dashboard offers this APK for download (served from the package's static dir).
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: bridge/atvbridge/static
      - name: Licence and notices into the image
        run: cp LICENSE NOTICE bridge/
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/atvbridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - uses: softprops/action-gh-release@v3
        with:
          files: ATVBridge.apk
          generate_release_notes: true
