services:
  atvbridge:
    # Prebuilt by GitHub Actions; or replace with `build: .` to build locally.
    image: ghcr.io/OWNER/atvbridge:latest
    container_name: atvbridge
    # Required: mDNS for phones (Google TV remote) and HomeKit (Siri voice remote),
    # and the Google TV / HomeKit ports must be on the LAN directly.
    network_mode: host
    restart: unless-stopped
    volumes:
      # Pairings (Apple TV, phones, Siri remote), settings, speech model cache.
      # On Unraid: /mnt/user/appdata/atvbridge:/data
      - ./data:/data
    environment:
      - TZ=Etc/UTC
      # - ATVB_HOST_IP=192.168.0.10       # set if the advertised IP is wrong (several NICs)
      # - ATVB_SIRI=0                     # turn the bundled Siri voice remote off
      # - ATVB_SIRI_PINCODE=031-45-154    # HomeKit setup code for the Siri remote
      # - ATVB_WHISPER_MODEL=base.en      # local speech fallback
      # - ATVB_ONLINE_ARTWORK=0           # no YouTube/App Store artwork lookups
      # - ATVB_LOG_LEVEL=DEBUG
